<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无言以队 · 舞弊审计调查辅助台</title>
<meta name="description" content="金融业舞弊审计调查岗位 AI 工作助理 —— 多源数据聚合、风险信号识别、线索梳理、可疑度评估、证据核对、报告初稿、问答与提醒。AI辅助生成，不构成调查结论。">
<style>
/* ============================================================
 * 无言以队 · 舞弊审计调查辅助台 —— 样式
 * 风格：商务专业，蓝色系，克制，信息密度适中
 * 主色 #1E5AA8 | 深蓝 #123A6B | 交互 #2F80ED
 * 背景 #F5F7FA | 卡片 #FFFFFF | 边框 #E3E8EF
 * 状态：高度 #D93025 | 中度 #F29900 | 低度 #1E8E3E | 信息不足 #5F6368
 * ============================================================ */
:root {
  --primary: #1E5AA8;
  --primary-dark: #123A6B;
  --primary-light: #2F80ED;
  --bg: #F5F7FA;
  --card: #FFFFFF;
  --border: #E3E8EF;
  --text: #1F2937;
  --text-sub: #5F6368;
  --text-dim: #8A93A3;
  --high: #D93025;
  --medium: #F29900;
  --low: #1E8E3E;
  --unknown: #5F6368;
  --radius: 5px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06);
  --font: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ============ 顶部栏 ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 56px;
  padding: 0 20px;
  background: var(--primary-dark);
  color: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: var(--radius);
  background: var(--primary-light);
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}

.brand-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .3px;
  white-space: nowrap;
}

.brand-sub {
  font-size: 12px;
  color: rgba(255, 255, 255, .72);
  white-space: nowrap;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* 全局提示条（固定显示） */
.global-notice {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border: 1px solid rgba(255, 255, 255, .35);
  border-radius: 3px;
  background: rgba(255, 255, 255, .1);
  font-size: 12px;
  color: #fff;
  white-space: nowrap;
}

.global-notice .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #FFC53D;
  flex-shrink: 0;
}

/* 模式切换 */
.mode-switch {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  border: 1px solid rgba(255, 255, 255, .35);
  border-radius: 3px;
  background: rgba(255, 255, 255, .08);
  font-size: 12px;
}

.mode-switch label {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  white-space: nowrap;
}

.mode-switch input[type="radio"] {
  accent-color: #FFC53D;
  margin: 0;
  cursor: pointer;
}

.mode-status {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  white-space: nowrap;
}

.mode-status .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--unknown);
  flex-shrink: 0;
}

.mode-status.live .dot { background: var(--low); }
.mode-status.demo .dot { background: var(--medium); }
.mode-status.off .dot { background: var(--high); }

/* ============ 布局 ============ */
.layout {
  display: flex;
  min-height: calc(100vh - 56px);
}

.sidebar {
  width: 178px;
  flex-shrink: 0;
  background: var(--primary-dark);
  border-right: 1px solid rgba(0, 0, 0, .1);
  padding: 12px 0 24px;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 10px 16px;
  border: 0;
  border-left: 3px solid transparent;
  background: transparent;
  color: rgba(255, 255, 255, .78);
  font-family: var(--font);
  font-size: 13.5px;
  text-align: left;
  cursor: pointer;
  transition: background .12s, color .12s;
}

.nav-item:hover {
  background: rgba(255, 255, 255, .07);
  color: #fff;
}

.nav-item.active {
  background: rgba(47, 128, 237, .22);
  border-left-color: var(--primary-light);
  color: #fff;
  font-weight: 600;
}

.nav-item .nav-ico {
  width: 16px;
  text-align: center;
  font-size: 13px;
  flex-shrink: 0;
}

.nav-sep {
  height: 1px;
  margin: 10px 14px;
  background: rgba(255, 255, 255, .12);
}

.nav-item.nav-example {
  color: rgba(255, 213, 79, .9);
}

.nav-item.nav-example.active {
  background: rgba(242, 153, 0, .2);
  border-left-color: #F29900;
  color: #FFD54F;
}

.sidebar-foot {
  padding: 12px 16px 0;
  font-size: 11px;
  line-height: 1.7;
  color: rgba(255, 255, 255, .42);
}

/* ============ 主区 ============ */
.main {
  flex: 1;
  min-width: 0;
  padding: 16px 20px 40px;
}

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.page-title {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  color: var(--primary-dark);
}

.page-desc {
  margin: 4px 0 0;
  font-size: 12.5px;
  color: var(--text-sub);
  line-height: 1.6;
}

.page-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

/* ============ 卡片 ============ */
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  margin-bottom: 14px;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.card-title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title .num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 3px;
  background: var(--primary);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  flex-shrink: 0;
}

.card-sub {
  font-size: 12px;
  color: var(--text-sub);
}

/* 灰色角标：AI辅助 · 供参考 */
.ai-badge {
  position: absolute;
  top: 9px;
  right: 12px;
  padding: 1px 7px;
  border: 1px solid #D5DAE1;
  border-radius: 2px;
  background: #F1F3F6;
  color: #6B7280;
  font-size: 10.5px;
  letter-spacing: .2px;
  line-height: 1.6;
  white-space: nowrap;
  z-index: 2;
}

/* 带角标的卡片：为角标预留右侧空间，避免与标题/副标题重叠 */
.card:has(> .ai-badge) > .card-head {
  padding-right: 106px;
}

/* :has() 不被支持时（旧版浏览器）退化为固定右内边距 */
.card.has-badge > .card-head {
  padding-right: 106px;
}
.card.has-badge > .card-head .card-sub {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============ 筛选条件区 ============ */
.filter-bar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  margin-bottom: 14px;
}

.filter-bar-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--primary-dark);
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
  gap: 10px 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.field > label {
  font-size: 12px;
  color: var(--text-sub);
  font-weight: 600;
}

.field .hint {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 400;
}

input[type="text"], input[type="date"], input[type="number"], input[type="search"],
select, textarea {
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  transition: border-color .12s, box-shadow .12s;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary-light);
  box-shadow: 0 0 0 2px rgba(47, 128, 237, .14);
}

select { cursor: pointer; }

textarea {
  resize: vertical;
  min-height: 70px;
}

.field-wide {
  grid-column: 1 / -1;
}

.checkbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  padding-top: 2px;
}

.checkbox-row label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}

.checkbox-row input[type="checkbox"] {
  accent-color: var(--primary);
  margin: 0;
  cursor: pointer;
}

.filter-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
}

.filter-actions .spacer { flex: 1; }

/* ============ 自然语言调查描述（chat 触发） ============ */
.nl-box {
  margin-top: 2px;
  padding: 10px 12px;
  border: 1px solid #D7E3F4;
  border-radius: 5px;
  background: #F7FAFE;
}

.nl-box .nl-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--deep);
  margin-bottom: 7px;
}

.nl-box .nl-tag {
  font-weight: 400;
  font-size: 11px;
  color: #5F6368;
  border: 1px solid #D5DAE1;
  border-radius: 2px;
  padding: 0 5px;
  background: #fff;
}

.nl-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.nl-row input.nl-input {
  flex: 1;
  min-width: 0;
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--font);
  font-size: 13px;
  color: var(--text);
  background: #fff;
}

.nl-row input.nl-input:focus {
  outline: none;
  border-color: var(--interactive);
  box-shadow: 0 0 0 2px rgba(47, 128, 237, .12);
}

.nl-examples {
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--text-sub);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.nl-examples .nl-chip {
  cursor: pointer;
  border: 1px dashed #C3D3E8;
  border-radius: 10px;
  padding: 1px 8px;
  background: #fff;
  color: #2B5C96;
}

.nl-examples .nl-chip:hover { background: #EEF5FE; border-style: solid; }

/* ============ 上传辅助数据 ============ */
.up-drop {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border: 1px dashed #C3D3E8;
  border-radius: 5px;
  background: #F9FBFE;
  transition: background .15s, border-color .15s;
}

.up-drop.over { background: #EEF5FE; border-color: var(--interactive); }

.up-drop .up-ico { font-size: 20px; opacity: .65; }
.up-drop .up-main { font-size: 13px; }
.up-drop .up-sub { font-size: 11.5px; color: var(--text-sub); margin-top: 2px; }

.up-files { margin-top: 8px; }

.up-file {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  font-size: 12.5px;
  margin-bottom: 5px;
}

.up-file .up-name { font-weight: 600; }
.up-file .up-meta { color: var(--text-sub); font-size: 11.5px; }
.up-file .up-del {
  cursor: pointer;
  color: #A02A21;
  border: none;
  background: none;
  font-size: 12px;
  padding: 2px 6px;
}

.up-file .up-del:hover { text-decoration: underline; }


/* ============ 按钮 ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s;
}

.btn:hover:not(:disabled) {
  border-color: var(--primary-light);
  color: var(--primary);
}

.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.btn-primary {
  border-color: var(--primary);
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  border-color: var(--primary-dark);
  background: var(--primary-dark);
  color: #fff;
}

.btn-sm {
  padding: 3px 9px;
  font-size: 12px;
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-sub);
}

.btn-ghost:hover:not(:disabled) {
  background: #F1F3F6;
  color: var(--primary);
  border-color: transparent;
}

.btn-danger {
  border-color: var(--high);
  background: #fff;
  color: var(--high);
}

/* ============ 统计卡 ============ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.stat-card {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
}

.stat-label {
  font-size: 11.5px;
  color: var(--text-sub);
  margin-bottom: 3px;
}

.stat-value {
  font-size: 19px;
  font-weight: 700;
  color: var(--primary-dark);
  line-height: 1.25;
  word-break: break-all;
}

.stat-value.sm { font-size: 14px; }
.stat-value.high { color: var(--high); }
.stat-value.medium { color: var(--medium); }
.stat-value.low { color: var(--low); }
.stat-value.unknown { color: var(--unknown); }

.stat-foot {
  margin-top: 3px;
  font-size: 11px;
  color: var(--text-dim);
}

/* ============ 表格 ============ */
.table-wrap {
  position: relative;
  max-height: 520px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
}

table.data {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}

table.data thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 8px 10px;
  background: #EDF1F7;
  border-bottom: 1px solid var(--border);
  color: var(--primary-dark);
  font-size: 12px;
  font-weight: 700;
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}

table.data thead th:hover { background: #E3E9F3; }

table.data thead th .sort-ind {
  display: inline-block;
  margin-left: 3px;
  color: var(--text-dim);
  font-size: 9px;
}

table.data thead th.sorted .sort-ind { color: var(--primary-light); }

table.data tbody td {
  padding: 7px 10px;
  border-bottom: 1px solid #F0F2F5;
  vertical-align: top;
  word-break: break-word;
}

table.data tbody tr:hover { background: #F7F9FC; }

table.data tbody tr.row-high { box-shadow: inset 3px 0 0 var(--high); }
table.data tbody tr.row-medium { box-shadow: inset 3px 0 0 var(--medium); }
table.data tbody tr.row-low { box-shadow: inset 3px 0 0 var(--low); }
table.data tbody tr.row-unknown { box-shadow: inset 3px 0 0 var(--unknown); }

td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; }

.table-empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}

.table-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 2px 0;
  font-size: 12px;
  color: var(--text-sub);
}

/* 分页 */
.pager {
  display: flex;
  align-items: center;
  gap: 5px;
}

.pager button {
  min-width: 26px;
  height: 24px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #fff;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
}

.pager button:hover:not(:disabled) { border-color: var(--primary-light); color: var(--primary); }
.pager button:disabled { opacity: .4; cursor: not-allowed; }
.pager button.cur { border-color: var(--primary); background: var(--primary); color: #fff; }

/* ============ 等级徽标 ============ */
.grade {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.grade::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

.grade-high { color: var(--high); background: #FDECEA; }
.grade-medium { color: #B26A00; background: #FEF3E0; }
.grade-low { color: var(--low); background: #E9F6EE; }
.grade-unknown { color: var(--unknown); background: #F1F3F6; }

.tag {
  display: inline-block;
  padding: 1px 7px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #F7F9FC;
  color: var(--text-sub);
  font-size: 11.5px;
  white-space: nowrap;
}

.tag-blue { border-color: #C7DAF5; background: #EDF4FE; color: var(--primary); }
.tag-warn { border-color: #F7DFB5; background: #FEF6E7; color: #B26A00; }
.tag-danger { border-color: #F5C6C2; background: #FDECEA; color: var(--high); }
.tag-ok { border-color: #BFE3CC; background: #E9F6EE; color: var(--low); }

/* ============ 溯源轨迹 ============ */
.trace {
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #FAFBFD;
  overflow: hidden;
}

.trace-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 12px;
  background: #EEF2F8;
  cursor: pointer;
  user-select: none;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--primary-dark);
}

.trace-head:hover { background: #E5EBF5; }

.trace-head .chev {
  display: inline-block;
  transition: transform .15s;
  font-size: 10px;
  color: var(--text-sub);
}

.trace.open .trace-head .chev { transform: rotate(90deg); }

.trace-body {
  display: none;
  padding: 10px 12px;
  font-size: 12.5px;
}

.trace.open .trace-body { display: block; }

.trace-section {
  margin-bottom: 10px;
}

.trace-section:last-child { margin-bottom: 0; }

.trace-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-sub);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: .3px;
}

.trace-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.trace-sql {
  margin: 0;
  padding: 8px 10px;
  border-radius: 4px;
  background: #14202E;
  color: #D6E2F0;
  font-family: Consolas, "Courier New", monospace;
  font-size: 11.5px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 180px;
  overflow: auto;
}

/* ============ 图表 ============ */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}

.chart-box {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  background: #fff;
}

.chart-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 8px;
}

.chart-box svg { display: block; width: 100%; height: auto; }

/* 水平条形图（HTML 布局，文字不拉伸） */
.hbar-chart {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.hbar-row {
  display: grid;
  grid-template-columns: minmax(70px, 34%) 1fr minmax(34px, auto);
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.hbar-label {
  color: var(--text-sub);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.4;
}

.hbar-track {
  display: block;
  height: 12px;
  border-radius: 2px;
  background: #EEF2F7;
  overflow: hidden;
}

.hbar-fill {
  display: block;
  height: 100%;
  border-radius: 2px;
  min-width: 2px;
  transition: width .25s;
}

.hbar-value {
  color: var(--primary-dark);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--text-sub);
}

.chart-legend span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.chart-legend i {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  display: inline-block;
}

/* ============ 标签页 ============ */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
  overflow-x: auto;
}

.tab {
  padding: 7px 14px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text-sub);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.tab:hover { color: var(--primary); }

.tab.active {
  border-bottom-color: var(--primary);
  color: var(--primary);
}

.tab .count {
  display: inline-block;
  margin-left: 4px;
  padding: 0 5px;
  border-radius: 8px;
  background: #E8EDF5;
  color: var(--text-sub);
  font-size: 11px;
  font-weight: 600;
}

.tab.active .count {
  background: #DCE8FA;
  color: var(--primary);
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ============ 步骤条 ============ */
.steps {
  display: flex;
  gap: 0;
  margin-bottom: 14px;
  overflow-x: auto;
}

.step {
  flex: 1;
  min-width: 150px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-right: 0;
  background: #fff;
  font-size: 12.5px;
  position: relative;
}

.step:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.step:last-child { border-right: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; }

.step.active { background: #EDF4FE; border-color: #C7DAF5; }
.step.done { background: #F3F8F4; }

.step-label {
  font-weight: 700;
  color: var(--primary-dark);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.step.done .step-label { color: var(--low); }

.step-desc {
  margin-top: 2px;
  color: var(--text-sub);
  font-size: 11.5px;
  line-height: 1.5;
}

.step-count {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
}

/* ============ 线索卡片 ============ */
.clue-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.clue {
  border: 1px solid var(--border);
  border-left: 4px solid var(--unknown);
  border-radius: var(--radius);
  background: #fff;
  overflow: hidden;
}

.clue.high { border-left-color: var(--high); }
.clue.medium { border-left-color: var(--medium); }
.clue.low { border-left-color: var(--low); }

.clue-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 14px;
  background: #FAFBFD;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}

.clue-head:hover { background: #F3F6FB; }

.clue-title {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex-wrap: wrap;
}

.clue-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary-dark);
}

.clue-id {
  font-family: Consolas, monospace;
  font-size: 11.5px;
  color: var(--text-dim);
}

.clue-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-sub);
  flex-shrink: 0;
}

.clue-body {
  display: none;
  padding: 12px 14px;
}

.clue.open .clue-body { display: block; }

.six-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 10px 16px;
  margin-bottom: 12px;
}

.six-item {
  border-left: 2px solid var(--border);
  padding-left: 9px;
}

.six-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 2px;
}

.six-value {
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--text);
  word-break: break-word;
}

.six-value ul {
  margin: 0;
  padding-left: 16px;
}

.six-value li { margin-bottom: 2px; }

/* 视图切换 */
.view-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.view-tab {
  padding: 3px 11px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #fff;
  color: var(--text-sub);
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
}

.view-tab.active {
  border-color: var(--primary);
  background: var(--primary);
  color: #fff;
  font-weight: 600;
}

.kv-list {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 4px 12px;
  font-size: 12.5px;
}

.kv-list dt {
  color: var(--text-sub);
  font-weight: 600;
  white-space: nowrap;
}

.kv-list dd {
  margin: 0;
  word-break: break-word;
}

/* 时间轴 */
.timeline {
  position: relative;
  padding-left: 18px;
  margin: 4px 0;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 5px;
  bottom: 5px;
  width: 2px;
  background: var(--border);
}

.timeline-item {
  position: relative;
  padding: 0 0 10px 0;
  font-size: 12.5px;
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -18px;
  top: 5px;
  width: 8px;
  height: 8px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--primary-light);
  box-shadow: 0 0 0 1px var(--primary-light);
}

.timeline-item.high::before { background: var(--high); box-shadow: 0 0 0 1px var(--high); }
.timeline-item.medium::before { background: var(--medium); box-shadow: 0 0 0 1px var(--medium); }
.timeline-item.low::before { background: var(--low); box-shadow: 0 0 0 1px var(--low); }

.timeline-date {
  font-weight: 700;
  color: var(--primary-dark);
  margin-right: 6px;
}

/* ============ 评分卡 ============ */
.score-hero {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(90deg, #F7FAFE 0%, #fff 60%);
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.score-ring {
  position: relative;
  width: 112px;
  height: 112px;
  flex-shrink: 0;
}

.score-ring svg { transform: rotate(-90deg); }

.score-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.score-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary-dark);
  line-height: 1;
}

.score-max {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

.score-info { flex: 1; min-width: 200px; }

.score-band {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 12px;
  border-radius: 3px;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 6px;
}

.score-advice {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.65;
}

.score-decl {
  font-size: 11.5px;
  color: var(--high);
  background: #FDECEA;
  border: 1px solid #F5C6C2;
  border-radius: 3px;
  padding: 5px 9px;
  line-height: 1.6;
}

.dim-bar {
  margin-bottom: 10px;
}

.dim-bar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  margin-bottom: 3px;
}

.dim-bar-name { font-weight: 700; color: var(--primary-dark); }
.dim-bar-val { font-variant-numeric: tabular-nums; color: var(--text-sub); }

.dim-bar-track {
  height: 8px;
  border-radius: 4px;
  background: #EDF1F7;
  overflow: hidden;
}

.dim-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--primary-light);
  transition: width .3s;
}

.dim-bar-fill.high { background: var(--high); }
.dim-bar-fill.medium { background: var(--medium); }
.dim-bar-fill.low { background: var(--low); }

.dim-desc {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.55;
}

/* ============ 报告预览 ============ */
.report-preview {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  padding: 26px 32px;
  max-height: 620px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.85;
}

.report-preview h1 {
  margin: 0 0 4px;
  font-size: 20px;
  text-align: center;
  color: var(--primary-dark);
  letter-spacing: 1px;
}

.report-no {
  text-align: center;
  font-size: 12px;
  color: var(--text-sub);
  margin-bottom: 16px;
}

.report-decl-box {
  border: 1px solid #F0C9C5;
  border-left: 4px solid var(--high);
  border-radius: 3px;
  background: #FEF7F6;
  padding: 10px 14px;
  margin: 0 0 18px;
  font-size: 12px;
  line-height: 1.9;
  color: #8A2A22;
  white-space: pre-wrap;
}

.report-preview h2 {
  margin: 22px 0 9px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
  color: var(--primary-dark);
}

.report-preview h3 {
  margin: 14px 0 6px;
  font-size: 13.5px;
  color: var(--primary);
}

.report-preview p { margin: 0 0 8px; }

.report-preview table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 8px 0 12px;
}

.report-preview th, .report-preview td {
  border: 1px solid var(--border);
  padding: 5px 8px;
  text-align: left;
  vertical-align: top;
}

.report-preview th {
  background: #EDF1F7;
  font-weight: 700;
  color: var(--primary-dark);
}

.report-clue {
  border: 1px solid var(--border);
  border-left: 3px solid var(--primary-light);
  border-radius: 3px;
  padding: 9px 12px;
  margin-bottom: 9px;
  background: #FAFBFD;
  font-size: 12.5px;
}

.report-clue-head {
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.report-clue dl {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 2px 10px;
  margin: 0;
  font-size: 12px;
}

.report-clue dt { color: var(--text-sub); white-space: nowrap; }
.report-clue dd { margin: 0; }

.report-footer-box {
  margin-top: 24px;
  padding-top: 14px;
  border-top: 2px solid var(--border);
  font-size: 12px;
  line-height: 2;
  color: var(--text);
  white-space: pre-wrap;
  font-family: var(--font);
}

/* ============ 上传区 ============ */
.upload-zone {
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  background: #FAFBFD;
  padding: 18px;
  text-align: center;
  transition: border-color .12s, background .12s;
  cursor: pointer;
}

.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--primary-light);
  background: #F2F7FE;
}

.upload-zone .ico { font-size: 22px; color: var(--primary-light); margin-bottom: 4px; }
.upload-zone .t1 { font-size: 13px; font-weight: 600; color: var(--text); }
.upload-zone .t2 { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

.file-list {
  margin-top: 9px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.file-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #fff;
  font-size: 12px;
}

.file-item .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item .fsize { color: var(--text-dim); flex-shrink: 0; }

/* ============ 对话 ============ */
.chat-box {
  display: flex;
  flex-direction: column;
  height: 400px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #FAFBFD;
  overflow: hidden;
}

.chat-log {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg { display: flex; gap: 9px; max-width: 88%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

.msg.ai .msg-avatar { background: var(--primary); color: #fff; }
.msg.user .msg-avatar { background: #E3E9F3; color: var(--primary-dark); }

.msg-bubble {
  padding: 8px 12px;
  border-radius: 5px;
  font-size: 13px;
  line-height: 1.7;
  word-break: break-word;
}

.msg.ai .msg-bubble {
  background: #fff;
  border: 1px solid var(--border);
  color: var(--text);
}

.msg.user .msg-bubble {
  background: var(--primary);
  color: #fff;
}

.msg-bubble .meta {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
  font-size: 11px;
  color: var(--text-dim);
}

.chat-input {
  display: flex;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid var(--border);
  background: #fff;
  align-items: flex-end;
}

.chat-input textarea {
  flex: 1;
  min-height: 42px;
  max-height: 100px;
  resize: none;
}

.mic-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  color: var(--text-sub);
  font-size: 17px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s;
}

.mic-btn:hover { border-color: var(--primary-light); color: var(--primary); }
.mic-btn.recording { background: #FDECEA; border-color: var(--high); color: var(--high); animation: pulse 1.2s infinite; }
.mic-btn:disabled { opacity: .45; cursor: not-allowed; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, .3); }
  50% { box-shadow: 0 0 0 6px rgba(217, 48, 37, 0); }
}

.suggest-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.suggest-chip {
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  color: var(--primary);
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
}

.suggest-chip:hover { border-color: var(--primary-light); background: #F2F7FE; }

/* ============ 提醒列表 ============ */
.todo-group { margin-bottom: 16px; }

.todo-group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--primary-dark);
}

.todo {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--medium);
  border-radius: 3px;
  background: #fff;
  margin-bottom: 7px;
  font-size: 12.5px;
}

.todo.high { border-left-color: var(--high); }
.todo.medium { border-left-color: var(--medium); }
.todo.low { border-left-color: var(--low); }
.todo.done { opacity: .55; background: #FAFBFC; }
.todo.done .todo-text { text-decoration: line-through; }

.todo-main { flex: 1; min-width: 0; }

.todo-text { line-height: 1.65; margin-bottom: 3px; }

.todo-sub {
  font-size: 11.5px;
  color: var(--text-sub);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* ============ 示例页 ============ */
.example-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

.example-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  padding: 13px 15px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  transition: border-color .12s, transform .12s;
}

.example-card:hover { border-color: var(--primary-light); }

.example-group {
  display: inline-block;
  align-self: flex-start;
  padding: 1px 7px;
  border-radius: 3px;
  background: #EDF4FE;
  color: var(--primary);
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 7px;
}

.example-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 5px;
  line-height: 1.5;
}

.example-desc {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.65;
  flex: 1;
  margin-bottom: 10px;
}

.example-actions { display: flex; gap: 7px; }

/* ============ 通用 ============ */
.notice {
  padding: 9px 13px;
  border-radius: var(--radius);
  font-size: 12.5px;
  line-height: 1.7;
  margin-bottom: 12px;
}

.notice-info { border: 1px solid #C7DAF5; background: #F2F7FE; color: #1B4A82; }
.notice-warn { border: 1px solid #F7DFB5; background: #FEF9F0; color: #8A5A00; }
.notice-danger { border: 1px solid #F0C9C5; background: #FEF7F6; color: #A02A21; }
.notice-ok { border: 1px solid #BFE3CC; background: #F4FBF6; color: #1B6B34; }

.muted { color: var(--text-sub); }
.dim { color: var(--text-dim); }
.mono { font-family: Consolas, "Courier New", monospace; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.mb0 { margin-bottom: 0; }
.mt10 { margin-top: 10px; }
.mt14 { margin-top: 14px; }
.flex { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.gap8 { gap: 8px; }
.gap12 { gap: 12px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.flex1 { flex: 1; min-width: 0; }

.empty-state {
  padding: 48px 20px;
  text-align: center;
  color: var(--text-dim);
}

.empty-state .ico { font-size: 34px; margin-bottom: 8px; opacity: .5; }
.empty-state .t1 { font-size: 14px; font-weight: 600; color: var(--text-sub); margin-bottom: 4px; }

.loading-bar {

  height: 3px;

  background: #E8EDF5;
  border-radius: 2px;
  margin-bottom: 12px;
  display: none;
}

.loading-bar.on { display: block; }

.loading-bar::after {
  content: '';
  position: absolute;
  top: 0;
  left: -40%;
  width: 40%;
  height: 100%;
  background: var(--primary-light);
  animation: slide 1.1s infinite;
}

@keyframes slide {
  0% { left: -40%; }
  100% { left: 100%; }
}

.spinner {
  display: inline-block;
  width: 13px;
  height: 13px;
  border: 2px solid rgba(255, 255, 255, .4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: -2px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast-wrap {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  min-width: 190px;
  max-width: 380px;
  padding: 9px 14px;
  border-radius: 4px;
  background: #24303F;
  color: #fff;
  font-size: 12.5px;
  line-height: 1.6;
  box-shadow: 0 3px 12px rgba(0, 0, 0, .2);

.toast.err { background: #A02A21; }
.toast.warn { background: #8A5A00; }

@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }

    /* 明确区间：2024-01-01 至 2024-06-30 / 2024年1月至6月 */
    const iso = s.match(/(\d{4})[-/年](\d{1,2})[-/月]?(\d{1,2})?日?\s*(?:至|到|~|-|—|—)\s*(\d{4})?[-/年]?(\d{1,2})[-/月]?(\d{1,2})?/);
    if (iso) {
      const y1 = iso[1], m1 = iso[2].padStart(2, '0'), d1 = (iso[3] || '01').padStart(2, '0');
      const y2 = iso[4] || y1, m2 = iso[5].padStart(2, '0');
      const d2 = iso[6] ? iso[6].padStart(2, '0') : String(new Date(Number(y2), Number(m2), 0).getDate()).padStart(2, '0');
      from = `${y1}-${m1}-${d1}`; to = `${y2}-${m2}-${d2}`;
      return { from, to };
    }
    /* 季度：2024年第2季度 / 2024年二季度 */
    const q = s.match(/(\d{4})\s*年?\s*第?\s*([1-4一二三四])\s*季度/);
    if (q) {
      const y = q[1];
      const qi = '一二三四'.indexOf(q[2]) >= 0 ? '一二三四'.indexOf(q[2]) + 1 : Number(q[2]);
      const sm = (qi - 1) * 3 + 1, em = qi * 3;
      return {
        from: `${y}-${String(sm).padStart(2, '0')}-01`,
        to: `${y}-${String(em).padStart(2, '0')}-${new Date(Number(y), em, 0).getDate()}`
      };
    }
    /* 单月：2024年3月 */
    const m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月/);
    if (m) {
      const y = m[1], mm = m[2].padStart(2, '0');
      return { from: `${y}-${mm}-01`, to: `${y}-${mm}-${new Date(Number(y), Number(mm), 0).getDate()}` };
    }
    /* 整年：2024年 / 2024年度 / 全文 2024 */
    const y = s.match(/(20\d{2})\s*年?(?:度|全年|整年)?/);
    if (y) return { from: `${y[1]}-01-01`, to: `${y[1]}-12-31` };
    return null;
  }

  /** 金额解析：支持「500万」「300万元以上」「10万到50万之间」「不超过200万」 */
  function parseAmount(text) {
    const s = String(text || '');
    const out = { min: null, max: null };
    const num = (raw, unit) => {
      const v = Number(raw);
      if (!Number.isFinite(v)) return null;
      return /亿/.test(unit || '') ? v * 100000000 : (/万/.test(unit || '') ? v * 10000 : v);
    };
    /* 区间：10万到50万 / 10万-50万 / 10万~50万 */
    const range = s.match(/(\d+(?:\.\d+)?)\s*(亿|万)?\s*(?:元)?\s*(?:到|至|~|-|—)\s*(\d+(?:\.\d+)?)\s*(亿|万)?\s*元?/);
    if (range) {
      out.min = num(range[1], range[2] || range[4]);
      out.max = num(range[3], range[4] || range[2]);
      return out;
    }
    /* 以下 / 不超过 / 小于（先判定「上限」，否则「不超过200万」会被「以上」分支误判） */
    const le = s.match(/(?:不超过|不高于|少于|低于|小于|最多)\s*(\d+(?:\.\d+)?)\s*(亿|万)?\s*元?|(\d+(?:\.\d+)?)\s*(亿|万)\s*元?\s*(?:以下|及以下|以内|之内)/);
    if (le) { out.max = num(le[1] || le[3], le[2] || le[4]); return out; }
    /* 以上 / 不低于 / 超过 */
    const ge = s.match(/(?:不低于|不少于|超过|大于|至少)\s*(\d+(?:\.\d+)?)\s*(亿|万)?\s*元?|(\d+(?:\.\d+)?)\s*(亿|万)\s*元?\s*(?:以上|及以上)/);
    if (ge) out.min = num(ge[1] || ge[3], ge[2] || ge[4]);
    return out;

  }

  /**
   * 解析自然语言调查意图
   * @param {string} text 用户输入，如「聚合A供应商2024年全年的采购与付款数据」
   * @param {object} opts { entities: { supplier:[{code,name}], customer:[], employee:[] } }
   * @returns {{matched:boolean, entityType, entityCode, entityName, period, amount, chains, keywords, note}}
   */
  function parseNaturalQuery(text, opts) {
    const s = String(text || '');
    const o = opts || {};
    const entities = o.entities || {};
    const res = {
      matched: false, entityType: 'all', entityCode: '', entityName: '',
      period: null, amount: null, chains: [], raw: s, note: ''
    };
    if (!s.trim()) return res;

    /* —— 1. 匹配主体：优先按编码精确命中，其次按名称包含 —— */
    const tryKinds = [['supplier', entities.supplier], ['customer', entities.customer], ['employee', entities.employee]];
    for (let i = 0; i < tryKinds.length; i++) {
      const kind = tryKinds[i][0], list = tryKinds[i][1] || [];
      const hit = list.find((x) => x.code && s.toUpperCase().indexOf(String(x.code).toUpperCase()) >= 0) ||
        list.find((x) => x.name && s.indexOf(x.name) >= 0);
      if (hit) {
        res.entityType = kind;
        res.entityCode = hit.code || '';
        res.entityName = hit.name || '';
        break;
      }
    }
    /* 未命中清单时，尝试抽取"XX公司/XX有限公司"这类中文机构名 */
    if (res.entityType === 'all') {
      const m = s.match(/([\u4e00-\u9fa5A-Za-z0-9（）()]{2,30}?(?:有限公司|股份有限公司|公司|集团|事务所|中心))/);
      if (m) {
        res.entityName = m[1];
        res.entityType = /客户/.test(s) ? 'customer' : 'supplier';
      }
    }

    /* —— 2. 期间 —— */
    res.period = parsePeriod(s);
    /* —— 3. 金额 —— */
    const amt = parseAmount(s);
    if (amt.min != null || amt.max != null) res.amount = amt;
    /* —— 4. 链条 —— */
    const chains = [];
    CHAIN_KEYWORDS.forEach((k) => { if (k.re.test(s)) k.chains.forEach((c) => { if (chains.indexOf(c) < 0) chains.push(c); }); });
    /* 「采购与付款」同时命中 purchase/fund 时，以采购付款链为准，避免重复聚合 */
    if (chains.indexOf('purchase') >= 0 && chains.indexOf('fund') >= 0) {
      res.note = '识别到「采购与付款」表述，资金流水已包含在采购付款链中，未重复启用资金流链';
      res.chains = chains.filter((c) => c !== 'fund');
    } else {
      res.chains = chains;
    }

    res.matched = !!(res.entityName || res.period || res.chains.length || res.amount);
    return res;
  }

  /* ============================================================
   * 7.2 上传辅助数据（upload 交互方式）
   *
   * 用户上传的 Excel/CSV 仅在本次会话内使用，不写库、不上传外部。

  const UPLOAD_COLUMN_MAP = {

  };

  function normalizeUploadRow(row) {

      const key = Object.keys(row).find((k) => aliases.some((a) => String(k).trim().toLowerCase() === a.toLowerCase()));
      if (key != null && row[key] != null && String(row[key]).trim() !== '') out[canon] = row[key];
    });
    if (out.金额 != null) {
      const n = Number(String(out.金额).replace(/[,\s￥¥元]/g, ''));
      out.金额 = Number.isFinite(n) ? n : out.金额;
    }
    if (out.日期 != null) out.日期 = String(out.日期).slice(0, 10);

  }

  /* ---------- 银行账户 ---------- */
  const BANK_ACCTS = [

    ['1205-0002-3456-7890', '中国工商银行天津开发区支行', '一般户', 'CNY'],
    ['1207-0001-8901-2345', '中国建设银行天津滨海支行', '一般户', 'CNY'],
    ['1213-0001-0123-4567', '交通银行天津滨海支行', '一般户', 'CNY']

  /* ---------- 成本中心 / 项目 / 税率 ---------- */
  const CC_SEED = [
    ['CC-MFG-01', '总装一车间', 'D025', '制造'], ['CC-MFG-02', '总装二车间', 'D026', '制造'],
    ['CC-RD-01', '研发一部', 'D019', '研发'], ['CC-RD-02', '研发二部', 'D020', '研发'],
    ['CC-MGT-01', '财务管理中心', 'D004', '管理'], ['CC-SAL-01', '销售一部', 'D014', '销售']
  ];
  const PRJ_SEED = [
    ['PRJ-001', '新一代工业网关研发项目', 'D019', 'R&D', 8000000],
    ['PRJ-002', '智能温控器二代研发', 'D020', 'R&D', 5200000],
    ['PRJ-003', '产线自动化技改项目', 'D025', '技改', 3200000]
  ];
  const TAX_RATES = [
    ['13', 0.13, '增值税-标准税率13%'], ['9', 0.09, '增值税-低税率9%'],
    ['6', 0.06, '增值税-现代服务业6%'], ['0', 0.00, '增值税-出口零税率'], ['25', 0.25, '企业所得税25%']
  ];

  /* 电话/地址冲突（关联交易线索）：S028 与 S049、S050 共用联系方式 */
  const SHARED_PHONE = '13905678912';
  const SHARED_ADDR = '合肥市包河区徽州大道238号702室';

  /* ============================================================
   * 构建数据集
   * ============================================================ */
  function build() {
    const D = {
      subjects: [], cost_centers: [], departments: [], employees: [], products: [],
      customers: [], suppliers: [], tax_rates: [], projects: [], bank_accounts: [],
      gl_vouchers: [], gl_ledger: [], gl_voucher_entries: [],
      oa_expense_reports: [], oa_approval_records: [],
      pur_orders: [], pur_contracts: [], pur_order_items: [], pur_receipts: [],
      sal_orders: [], sal_deliveries: [], sal_order_items: [],
      bank_transactions: [], tax_invoice_pool: [], rd_timesheets: [], tax_vat_declarations: []
    };
    /**
     * 每张表独立主键计数：外键（po_id / voucher_id / so_id / report_id 等）
     * 直接引用目标表 id，构建期不回填、不重排，保证引用稳定。
     */
    const tableSeq = {};
    const nextIdFor = (table) => {
      tableSeq[table] = (tableSeq[table] || 0) + 1;
      return tableSeq[table];
    };
    const NOW = '2026-12-31T16:00:00.000Z';

    /* ---- 主数据 ---- */
    SUBJ_SEED.forEach(([code, name, type, parent, dir], i) => {
      D.subjects.push({ id: nextIdFor('subjects'), subject_code: code, subject_name: name, subject_type: type,
        parent_code: parent, dc_direction: dir, is_enabled: 1, created_at: '2026-01-01T00:00:00.000Z' });
    });
    CC_SEED.forEach(([code, name, dept, type], i) => {
      D.cost_centers.push({ id: nextIdFor('cost_centers'), cc_code: code, cc_name: name, dept_code: dept, cc_type: type, created_at: '2026-01-01T00:00:00.000Z' });
    });
    DEPTS.forEach(([code, name, parent], i) => {
      D.departments.push({ id: nextIdFor('departments'), dept_code: code, dept_name: name, parent_dept_code: parent, manager_emp_code: '', created_at: '2026-01-01T00:00:00.000Z' });
    });
    EMP_SEED.forEach(([code, name, dept, pos, idc, bank, hire]) => {
      D.employees.push({ id: nextIdFor('employees'), emp_code: code, emp_name: name, dept_code: dept, position: pos,
        id_card: idc, bank_account: bank, hire_date: hire + 'T16:00:00.000Z', created_at: '2026-01-01T00:00:00.000Z' });
    });
    PROD_SEED.forEach(([code, name, cat, unit, price, rate, spec]) => {
      D.products.push({ id: nextIdFor('products'), product_code: code, product_name: name, category: cat, unit,
        unit_price: round2(price), tax_rate_code: rate, spec, created_at: '2026-01-01T00:00:00.000Z' });
    });
    CUS_SEED.forEach(([code, name, tax, contact, phone, addr, credit]) => {
      D.customers.push({ id: nextIdFor('customers'), customer_code: code, customer_name: name, tax_no: tax,
        contact, phone, address: addr, credit_rating: credit, created_at: '2026-01-01T00:00:00.000Z' });
    });
    SUP_SEED.forEach(([code, name, tax, contact, phone, addr, terms]) => {
      D.suppliers.push({ id: nextIdFor('suppliers'), supplier_code: code, supplier_name: name, tax_no: tax,
        contact, phone, address: addr, payment_terms: terms, created_at: '2026-01-01T00:00:00.000Z' });
    });
    /* 关联交易植入：S049、S050 与 S028 共用电话/地址 */
    const supIdx = (code) => D.suppliers.findIndex((s) => s.supplier_code === code);
    D.suppliers[supIdx('S049')].phone = SHARED_PHONE;
    D.suppliers[supIdx('S049')].address = SHARED_ADDR;
    D.suppliers[supIdx('S050')].phone = '13905678912';
    /* S050 税号异常（不足 18 位），触发供应商准入资料不全 */
    D.suppliers[supIdx('S050')].tax_no = '91310100';
    TAX_RATES.forEach(([code, rate, desc]) => {
      D.tax_rates.push({ id: nextIdFor('tax_rates'), tax_rate_code: code, tax_rate: rate, description: desc, created_at: '2026-01-01T00:00:00.000Z' });
    });
    PRJ_SEED.forEach(([code, name, dept, type, budget]) => {
      D.projects.push({ id: nextIdFor('projects'), project_code: code, project_name: name, dept_code: dept,
        project_type: type, budget: round2(budget), start_date: '2026-01-01T16:00:00.000Z',
        end_date: '2026-12-31T16:00:00.000Z', status: '进行中', created_at: '2026-01-01T00:00:00.000Z' });
    });
    BANK_ACCTS.forEach(([no, bank, type, cur]) => {
      D.bank_accounts.push({ id: nextIdFor('bank_accounts'), account_no: no, bank_name: bank, account_type: type, currency: cur, created_at: '2026-01-01T00:00:00.000Z' });
    });

    const SUP_BY_CODE = {};
    D.suppliers.forEach((s) => { SUP_BY_CODE[s.supplier_code] = s; });
    const CUS_BY_CODE = {};
    D.customers.forEach((c) => { CUS_BY_CODE[c.customer_code] = c; });
    const PROD_BY_CODE = {};
    D.products.forEach((p) => { PROD_BY_CODE[p.product_code] = p; });

    /* ============================================================
     * ① 采购链：合同 → 订单 → 订单行 → 入库 → 进项发票 → 凭证 → 银行付款
     * ============================================================ */
    let poN = 0, prN = 0, invN = 0, vchN = 0, ctrN = 0;
    const purSuppliers = D.suppliers.filter((s) => s.supplier_code <= 'S050');

    /* 每家供应商 1 份年度框架合同 */
    purSuppliers.forEach((s) => {
      ctrN++;
      D.pur_contracts.push({
        id: nextIdFor('pur_contracts'), contract_no: `CON-2026-${pad(ctrN, 4)}`, supplier_code: s.supplier_code,
        contract_name: `${s.supplier_name}-年度采购框架协议`,
        total_amount: round2(R(3000000, 15000000)),
        sign_date: dstr(2026, RI(1, 3), RI(1, 27)) + 'T16:00:00.000Z',
        start_date: '2026-01-01T16:00:00.000Z', end_date: '2026-12-31T16:00:00.000Z',
        status: '执行中', created_at: '2026-01-05T00:00:00.000Z'
      });
    });
    const ctrOf = {};
    D.pur_contracts.forEach((c) => { ctrOf[c.supplier_code] = c.contract_no; });

    /* 采购订单生成：常规供应商每月 1~2 单；S028 每月 3 单 */
    function makePO(supplierCode, orderDate, maker, items) {
      poN++;
      const po = {
        id: nextIdFor('pur_orders'), po_no: `PO-2026${pad(new Date(orderDate).getMonth() + 1, 2)}-${pad(poN, 4)}`,
        supplier_code: supplierCode, contract_no: ctrOf[supplierCode] || '',
        order_date: orderDate, total_amount: 0, tax_amount: 0, grand_total: 0,
        status: '已入库', maker, created_at: orderDate.replace('T16:00:00.000Z', 'T09:00:00.000Z')
      };
      D.pur_orders.push(po);
      let amt = 0, tax = 0;
      items.forEach((it, idx) => {
        const p = PROD_BY_CODE[it.product_code];
        const qty = it.quantity;
        const price = it.unit_price != null ? it.unit_price : p.unit_price * R(0.92, 1.08);
        const lineAmt = round2(qty * price);
        const lineTax = round2(lineAmt * 0.13);
        amt = round2(amt + lineAmt); tax = round2(tax + lineTax);
        D.pur_order_items.push({
          id: nextIdFor('pur_order_items'), po_id: po.id, line_no: idx + 1, product_code: it.product_code,
          product_name: p.product_name, quantity: qty, unit: p.unit,
          unit_price: round2(price), tax_rate: 0.13, amount: lineAmt, tax_amount: lineTax,
          created_at: po.created_at
        });
      });
      po.total_amount = amt; po.tax_amount = tax; po.grand_total = round2(amt + tax);
      return po;
    }

    const normalPos = [];
    purSuppliers.forEach((s) => {
      if (s.supplier_code === 'S028') return;
      MONTHS.forEach((m) => {
        const cnt = (s.supplier_code >= 'S040') ? 1 : RI(1, 2);
        /* 常规采购单金额控制在 10 万 ~ 300 万元区间 */
        for (let k = 0; k < cnt; k++) {
          const d = RI(2, Math.min(26, daysInMonth(YEAR, m)));
          const maker = pick(['EMP031', 'EMP032', 'EMP033']);
          const mk = (s.supplier_code >= 'S043') ? 'EMP031' : maker;
          const prods = [pick(PROD_SEED)[0], pick(PROD_SEED)[0], pick(PROD_SEED)[0]];
          const uniq = Array.from(new Set(prods)).slice(0, RI(1, 3));
          const po = makePO(s.supplier_code, dstr(YEAR, m, d), mk,
            uniq.map((pc) => ({ product_code: pc, quantity: RI(2, 26) })));
          normalPos.push({ po, m, d });
        }
      });
    });

    /* —— 可疑供应商 S028：每月 3 单，单价显著高于基准价，制单人固定 EMP031 —— */
    const s028Pos = [];
    const s028PriceFactor = 2.6;
    MONTHS.forEach((m) => {
      for (let k = 0; k < 3; k++) {
        const d = RI(2, Math.min(25, daysInMonth(YEAR, m)));
        const po = makePO('S028', dstr(YEAR, m, d), 'EMP031', [
          { product_code: 'M001', quantity: RI(8, 32), unit_price: round2(PROD_BY_CODE.M001.unit_price * s028PriceFactor) },
          { product_code: 'M013', quantity: RI(3, 14), unit_price: round2(PROD_BY_CODE.M013.unit_price * s028PriceFactor) }
        ]);
        s028Pos.push({ po, m, d });
      }
    });

    /* ---- 入库单：常规订单 85% 入库；S028 的其中 2 张订单故意不入库（有票无货） ---- */
    const poHasReceipt = {};
    function makeReceipt(po, receiptDate, amount, status) {
      prN++;
      const r = {
        id: nextIdFor('pur_receipts'), receipt_no: `PR-2026-${pad(prN, 4)}`, po_id: po.id,
        receipt_date: receiptDate, total_amount: round2(amount), voucher_id: 0, status: status || '已入库',
        created_at: receiptDate.replace('T16:00:00.000Z', 'T10:00:00.000Z')
      };
      D.pur_receipts.push(r);
      poHasReceipt[po.id] = r;
      return r;
    }
    const allPos = D.pur_orders.slice();
    const noReceiptTargets = new Set();
    /* S028：每个季度第 1 单不入库 */
    s028Pos.filter((x, i) => i % 3 === 0 && x.m <= 9).forEach((x) => noReceiptTargets.add(x.po.id));
    /* 其他供应商：随机 6% 不入库 */
    normalPos.forEach((x) => { if (rnd() < 0.06) noReceiptTargets.add(x.po.id); });

    allPos.forEach((po) => {
      if (noReceiptTargets.has(po.id)) return;
      const od = new Date(po.order_date);
      const lag = RI(3, 20);
      const rd = clampYear(new Date(od.getTime() + lag * 86400000));
      const dateStr = `${rd.getFullYear()}-${pad(rd.getMonth() + 1, 2)}-${pad(rd.getDate(), 2)}T16:00:00.000Z`;
      makeReceipt(po, dateStr, po.total_amount, '已入库');
    });
    /* 单据日期倒挂样例：S028 的 7 月首单入库日期早于订单日期（订单≤入库≤发票链条断裂） */
    const revTarget = s028Pos.map((x) => x.po)
      .find((p) => poHasReceipt[p.id] && p.order_date.indexOf('-07-') > 0);
    if (revTarget) {
      const r = poHasReceipt[revTarget.id];
      const before = new Date(new Date(revTarget.order_date).getTime() - 11 * 86400000);
      r.receipt_date = `${before.getUTCFullYear()}-${pad(before.getUTCMonth() + 1, 2)}-${pad(before.getUTCDate(), 2)}T16:00:00.000Z`;
    } else {
      /* 兜底：任取一张有入库的 S028 订单 */
      const anyPo = D.pur_orders.find((p) => p.supplier_code === 'S028' && poHasReceipt[p.id]);
      if (anyPo) {
        const r = poHasReceipt[anyPo.id];
        const before = new Date(new Date(anyPo.order_date).getTime() - 11 * 86400000);
        r.receipt_date = `${before.getUTCFullYear()}-${pad(before.getUTCMonth() + 1, 2)}-${pad(before.getUTCDate(), 2)}T16:00:00.000Z`;
      }
    }

    /* ---- 进项发票：有入库单的 92% 有发票，S028 全部有发票（含无入库的订单） ---- */
    function makeInvoice(po, type, dateStr, amount, taxAmount, sourceRef, party) {
      invN++;
      return {
        id: nextIdFor('tax_invoice_pool'), invoice_no: `INV-${type === '进项' ? 'P' : 'S'}-2026-${pad(invN, 5)}`,
        invoice_type: type, invoice_date: dateStr, party_code: party.code, party_name: party.name,
        amount: round2(amount), tax_rate: 0.13, tax_amount: round2(taxAmount),
        total_amount: round2(amount + taxAmount), source_ref: sourceRef, voucher_id: 0,
        status: type === '进项' ? '已认证' : '正常', created_at: dateStr
      };
    }
    allPos.forEach((po) => {
      const r = poHasReceipt[po.id];
      const sup = SUP_BY_CODE[po.supplier_code];
      if (po.supplier_code === 'S028') {
        /* S028：无论是否入库都开票（整单） */
        const base = r ? r.receipt_date : po.order_date;
        const dd = clampYear(new Date(new Date(base).getTime() + RI(1, 8) * 86400000));
        const ds = `${dd.getFullYear()}-${pad(dd.getMonth() + 1, 2)}-${pad(dd.getDate(), 2)}T16:00:00.000Z`;
        const inv = makeInvoice(po, '进项', ds, po.total_amount, po.tax_amount,
          r ? r.receipt_no : po.po_no, { code: sup.supplier_code, name: sup.supplier_name });
        D.tax_invoice_pool.push(inv);
        return;
      }
      if (!r) return;
      if (rnd() < 0.92) {
        /* 金额不一致样例：3% 概率发票金额上调 5%~12% */
        let amt = po.total_amount, tax = po.tax_amount;
        if (rnd() < 0.03) { amt = round2(amt * R(1.05, 1.12)); tax = round2(amt * 0.13); }
        const dd = clampYear(new Date(new Date(r.receipt_date).getTime() + RI(1, 9) * 86400000));
        const ds = `${dd.getFullYear()}-${pad(dd.getMonth() + 1, 2)}-${pad(dd.getDate(), 2)}T16:00:00.000Z`;
        D.tax_invoice_pool.push(makeInvoice(po, '进项', ds, amt, tax, r.receipt_no,
          { code: sup.supplier_code, name: sup.supplier_name }));
      }
    });
    /* 进项发票无入库支撑样例：为 2 张无入库订单补开票（非 S028，制造孤立发票） */
    const orphanPO = D.pur_orders.filter((p) => !poHasReceipt[p.id] && p.supplier_code !== 'S028').slice(0, 3);
    orphanPO.forEach((po) => {
      const sup = SUP_BY_CODE[po.supplier_code];
      const dd = clampYear(new Date(new Date(po.order_date).getTime() + 5 * 86400000));
      D.tax_invoice_pool.push(makeInvoice(po, '进项',
        `${dd.getFullYear()}-${pad(dd.getMonth() + 1, 2)}-${pad(dd.getDate(), 2)}T16:00:00.000Z`,
        po.total_amount, po.tax_amount, po.po_no, { code: sup.supplier_code, name: sup.supplier_name }));
    });

    /* ---- 采购凭证（PUR）与付款银行流水 ---- */
    function makeVoucher(dateStr, type, summary, sourceSystem, sourceRef, debit, credit, maker, reviewer) {
      vchN++;
      const ym = dateStr.slice(0, 4) + dateStr.slice(5, 7);
      const v = {
        id: nextIdFor('gl_vouchers'), voucher_no: `VCH-${ym}-${pad(vchN, 4)}`, voucher_date: dateStr,
        voucher_type: type, summary, source_system: sourceSystem, source_ref: sourceRef,
        total_debit: round2(debit), total_credit: round2(credit != null ? credit : debit),
        maker, reviewer, status: '已审核', created_at: dateStr
      };
      D.gl_vouchers.push(v);
      return v;
    }
    function makeEntries(voucher, lines) {
      lines.forEach((ln, i) => {
        D.gl_voucher_entries.push({
          id: nextIdFor('gl_voucher_entries'), voucher_id: voucher.id, entry_line: i + 1, subject_code: ln.subject_code,
          summary: ln.summary, debit_amount: round2(ln.debit || 0), credit_amount: round2(ln.credit || 0),
          cost_center: ln.cost_center || '', project_code: ln.project_code || '', created_at: voucher.created_at
        });
      });
    }
    let bankN = 0;
    const paymentOfPO = {};
    function makePayment(po, dateStr, amount, counterparty, cptyAcct, summary, voucherId, matched) {
      bankN++;
      const ym = dateStr.slice(0, 4) + dateStr.slice(5, 7);
      const tx = {
        id: nextIdFor('bank_transactions'), bank_tx_id: `BTX-${ym}-${pad(bankN, 4)}`, account_no: MAIN_ACCT,
        tx_date: dateStr, tx_time: (`${pad(RI(9, 17), 2)}:${pad(RI(0, 59), 2)}`),
        tx_type: '支出', amount: round2(amount), counterparty, counterparty_account: cptyAcct,
        channel: '网银', summary, voucher_id: voucherId == null ? null : voucherId,
        matched: matched == null ? 1 : matched, created_at: dateStr
      };
      D.bank_transactions.push(tx);
      return tx;
    }

    const supAcct = (code) => '62' + pad(RI(100000000, 999999999), 9);
    D.pur_orders.forEach((po) => {
      const sup = SUP_BY_CODE[po.supplier_code];
      const r = poHasReceipt[po.id];
      const baseDate = r ? r.receipt_date : po.order_date;
      const payLag = RI(7, 40);
      const pd = clampYear(new Date(new Date(baseDate).getTime() + payLag * 86400000));
      const payDate = `${pd.getFullYear()}-${pad(pd.getMonth() + 1, 2)}-${pad(pd.getDate(), 2)}T16:00:00.000Z`;
      const v = makeVoucher(po.order_date, '记', `采购入库-${sup.supplier_name}-${PROD_BY_CODE[D.pur_order_items.find((x) => x.po_id === po.id).product_code].product_name}`,
        'PUR', po.po_no, po.grand_total, po.grand_total,
        po.maker, po.supplier_code === 'S028' ? 'EMP031' : 'EMP006');
      makeEntries(v, [
        { subject_code: '1403', summary: '原材料入库', debit: po.total_amount },
        { subject_code: '2221-02', summary: '进项税额13%', debit: po.tax_amount },
        { subject_code: '2202', summary: `应付${sup.supplier_name}`, credit: po.grand_total }
      ]);
      if (r) r.voucher_id = v.id;

      if (po.supplier_code === 'S028') {
        /*
         * —— 拆分付款植入 ——
         * 对每季度第 1 单，把本该一次支付的货款拆成 4~6 笔，
         * 单笔金额压在 4.1~4.9 万元（低于 5 万元审批线），集中落在同一周内。
         * 该形态对应 R05 规则（同一对手方 30 天内 ≥3 笔、单笔落在 4~5 万元区间）。
         */
        const sPos = s028Pos.find((x) => x.po.id === po.id);
        const isSplitPo = sPos && (s028Pos.indexOf(sPos) % 3) === 0;
        if (isSplitPo) {
          const total = po.grand_total;
          const parts = [];
          let left = total;
          /* 先拆出若干笔 4.1~4.9 万元的小额付款 */
          while (left > 50000 && parts.length < 8) {
            const a = round2(R(41000, 49000));
            parts.push(a);
            left = round2(left - a);
          }
          parts.push(left);
          const vp = makeVoucher(payDate, '付', `支付${sup.supplier_name}货款`, 'PUR', po.po_no, total, total, 'EMP031', 'EMP006');
          parts.forEach((part, i) => {
            /* 首笔即当日，其余顺延 0~2 天，形成短周期内多笔付款 */
            const dd = new Date(new Date(payDate).getTime() + (i === 0 ? 0 : RI(0, 2)) * 86400000);
            makePayment(po, clampYear(dd).toISOString(), part, sup.supplier_name, supAcct(sup.supplier_code),
              `银行付款-${sup.supplier_name}货款`, vp.id, 1);
          });
        } else {
          const vp = makeVoucher(payDate, '付', `支付${sup.supplier_name}货款`, 'PUR', po.po_no, po.grand_total, po.grand_total, 'EMP031', 'EMP006');
          makePayment(po, payDate, po.grand_total, sup.supplier_name, supAcct(sup.supplier_code),
            `银行付款-${sup.supplier_name}货款`, vp.id, 1);
        }
        paymentOfPO[po.id] = payDate;
        return;
      }

      /* 常规付款：85% 付款，其余挂账 */
      if (rnd() < 0.85) {
        const vp = makeVoucher(payDate, '付', `支付${sup.supplier_name}货款`, 'PUR', po.po_no, po.grand_total, po.grand_total, 'EMP013', 'EMP006');
        makePayment(po, payDate, po.grand_total, sup.supplier_name, supAcct(sup.supplier_code),
          `银行付款-${sup.supplier_name}货款`, vp.id, 1);
        paymentOfPO[po.id] = payDate;
      }
    });

    /* —— 资金回流植入：向 S028 付款后 21 天内，其法定代表人个人账户向本公司回流 —— */
    const S028_NAME = '安徽宏远机电设备有限公司';
    const s028Big = D.bank_transactions
      .filter((t) => t.counterparty === S028_NAME && t.tx_type === '支出')
      .sort((a, b) => b.amount - a.amount);
    /* 取金额最大的 3 笔（分处不同月份），确保回流记录落在同一会计年度 */
    const picked = [];
    const usedMonths = new Set();
    s028Big.forEach((t) => {
      const mm = t.tx_date.slice(5, 7);
      if (usedMonths.has(mm) || picked.length >= 3) return;
      const dd = new Date(new Date(t.tx_date).getTime() + 21 * 86400000);
      if (dd.getUTCFullYear() !== YEAR) return;
      usedMonths.add(mm);
      picked.push(t);
    });
    picked.forEach((tx) => {
      const dd = new Date(new Date(tx.tx_date).getTime() + 21 * 86400000);
      bankN++;
      const ymStr = `${dd.getUTCFullYear()}${pad(dd.getUTCMonth() + 1, 2)}`;
      D.bank_transactions.push({
        id: nextIdFor('bank_transactions'), bank_tx_id: `BTX-${ymStr}-${pad(bankN, 4)}`, account_no: MAIN_ACCT,
        tx_date: `${dd.getUTCFullYear()}-${pad(dd.getUTCMonth() + 1, 2)}-${pad(dd.getUTCDate(), 2)}T16:00:00.000Z`,
        tx_time: '21:47', tx_type: '收入', amount: round2(tx.amount * R(0.82, 0.95)),
        counterparty: '沈立国', counterparty_account: '6228480012345678',
        channel: '个人网银', summary: '个人转入-往来款',
        voucher_id: null, matched: 1, created_at: tx.tx_date
      });
    });

    /* —— 大额个人卡/现金付款植入（异常渠道） —— */
    const abnormalChannel = [
      { m: 3, d: 18, amt: 386000, cp: '个人-王某某', acct: '6212260098765432', ch: '个人网银', sum: '支付个人-往来款' },
      { m: 7, d: 9, amt: 268000, cp: '个人-李某某', acct: '6222020011223344', ch: '现金', sum: '现金支取-备用金' },
      { m: 11, d: 22, amt: 512000, cp: '个人-张某某', acct: '6228480055667788', ch: '个人网银', sum: '支付个人-劳务费' }
    ];
    abnormalChannel.forEach((x) => {
      const ds = dstr(YEAR, x.m, x.d) + 'T16:00:00.000Z';
      const vp = makeVoucher(ds, '付', `支付${x.cp}`, 'AIS', '', x.amt, x.amt, 'EMP008', 'EMP006');
      makePayment(null, ds, x.amt, x.cp, x.acct, x.sum, vp.id, 1);
    });

    /* —— 银行流水无账面凭证（voucher_id 为空） —— */
    [ { m: 2, d: 14, amt: 1246000, cp: '安徽宏远机电设备有限公司' },
      { m: 8, d: 27, amt: 883000, cp: '深圳市前海万通贸易有限公司' },
      { m: 10, d: 6, amt: 2100000, cp: '上海泰和商务咨询有限公司' }
    ].forEach((x) => {
      const ds = dstr(YEAR, x.m, x.d) + 'T16:00:00.000Z';
      const sup = D.suppliers.find((s) => s.supplier_name === x.cp);
      makePayment(null, ds, x.amt, x.cp, supAcct(sup ? sup.supplier_code : 'S001'), `银行付款-${x.cp}往来款`, null, 1);
    });

    /* —— 账面无银行流水支撑（matched=0 未达账项） —— */
    [ { m: 5, d: 30, amt: 3180000, cp: '太钢不锈销售有限公司' },
      { m: 12, d: 30, amt: 4760000, cp: '万华化学供应公司' }
    ].forEach((x) => {
      const ds = dstr(YEAR, x.m, x.d) + 'T16:00:00.000Z';
      const sup = D.suppliers.find((s) => s.supplier_name === x.cp);
      const vp = makeVoucher(ds, '付', `支付${x.cp}货款`, 'PUR', '', x.amt, x.amt, 'EMP013', 'EMP006');
      makePayment(null, ds, x.amt, x.cp, supAcct(sup.supplier_code), `银行付款-${x.cp}货款`, vp.id, 0);
    });

    /* ============================================================
     * ② 销售链：订单 → 订单行 → 发货 → 销项发票 → 收入凭证 → 收款流水
     * ============================================================ */
    let soN = 0, dlN = 0;
    MONTHS.forEach((m) => {
      const cnt = RI(34, 40);
      for (let k = 0; k < cnt; k++) {
        soN++;
        const d = RI(1, daysInMonth(YEAR, m));
        const ds = dstr(YEAR, m, d) + 'T16:00:00.000Z';
        const cus = pick(D.customers);
        const emp = pick(['EMP016', 'EMP017', 'EMP018']);
        const so = {
          id: nextIdFor('sal_orders'), so_no: `SO-${YEAR}${pad(m, 2)}-${pad(soN, 4)}`, customer_code: cus.customer_code,
          order_date: ds, total_amount: 0, tax_amount: 0, grand_total: 0, status: '已完成',
          sales_emp: emp, created_at: ds
        };
        D.sal_orders.push(so);
        const prods = Array.from(new Set([pick(PROD_SEED)[0], pick(PROD_SEED)[0]]));
        let amt = 0, tax = 0;
        prods.forEach((pc, idx) => {
          const p = PROD_BY_CODE[pc];
          const qty = RI(2, 60);
          const price = round2(p.unit_price * R(1.18, 1.45));
          const lineAmt = round2(qty * price);
          const lineTax = round2(lineAmt * 0.13);
          amt = round2(amt + lineAmt); tax = round2(tax + lineTax);
          D.sal_order_items.push({
            id: nextIdFor('sal_order_items'), so_id: so.id, line_no: idx + 1, product_code: pc, product_name: p.product_name,
            quantity: qty, unit: p.unit, unit_price: price, tax_rate: 0.13, amount: lineAmt,
            tax_amount: lineTax, created_at: ds
          });
        });
        so.total_amount = amt; so.tax_amount = tax; so.grand_total = round2(amt + tax);

        /* 发货 */
        dlN++;
        const ddd = clampYear(new Date(new Date(ds).getTime() + RI(2, 12) * 86400000));
        const dls = `${ddd.getFullYear()}-${pad(ddd.getMonth() + 1, 2)}-${pad(ddd.getDate(), 2)}T16:00:00.000Z`;
        const dl = {
          id: nextIdFor('sal_deliveries'), delivery_no: `DL-${YEAR}-${pad(dlN, 5)}`, so_id: so.id, delivery_date: dls,
          total_amount: so.total_amount, voucher_id: 0, status: '已发货', created_at: dls
        };
        D.sal_deliveries.push(dl);

        /* 收入凭证 + 销项发票 */
        vchN++;
        const v = {
          id: nextIdFor('gl_vouchers'), voucher_no: `VCH-${YEAR}${pad(m, 2)}-${pad(vchN, 4)}`, voucher_date: dls,
          voucher_type: '记', summary: `确认销售收入-${cus.customer_name}`,
          source_system: 'SAL', source_ref: so.so_no,
          total_debit: so.grand_total, total_credit: so.grand_total,
          maker: pick(['EMP012', 'EMP014', 'EMP011']), reviewer: 'EMP006', status: '已审核', created_at: dls
        };
        D.gl_vouchers.push(v);
        makeEntries(v, [
          { subject_code: '1122', summary: `应收${cus.customer_name}货款`, debit: so.grand_total },
          { subject_code: '6001', summary: '主营业务收入-装备制造', credit: so.total_amount },
          { subject_code: '2221-01', summary: '销项税额13%', credit: so.tax_amount }
        ]);
        /* 同步结转主营业务成本（成本率约 62%），使毛利率等指标可计算 */
        vchN++;
        const costAmt = round2(so.total_amount * 0.62);
        const vc = {
          id: nextIdFor('gl_vouchers'), voucher_no: `VCH-${YEAR}${pad(m, 2)}-${pad(vchN, 4)}`, voucher_date: dls,
          voucher_type: '转', summary: `结转销售成本-${cus.customer_name}`,
          source_system: 'AIS', source_ref: so.so_no,
          total_debit: costAmt, total_credit: costAmt,
          maker: 'EMP012', reviewer: 'EMP006', status: '已审核', created_at: dls
        };
        D.gl_vouchers.push(vc);
        makeEntries(vc, [
          { subject_code: '6401', summary: '主营业务成本-装备制造', debit: costAmt },
          { subject_code: '1405', summary: '库存商品结转', credit: costAmt }
        ]);
        dl.voucher_id = v.id;
        invN++;
        const ds2 = `${ddd.getFullYear()}-${pad(ddd.getMonth() + 1, 2)}-${pad(ddd.getDate(), 2)}T16:00:00.000Z`;
        D.tax_invoice_pool.push({
          id: nextIdFor('tax_invoice_pool'), invoice_no: `INV-S-${YEAR}-${pad(invN, 5)}`, invoice_type: '销项',
          invoice_date: ds2, party_code: cus.customer_code, party_name: cus.customer_name,
          amount: so.total_amount, tax_rate: 0.13, tax_amount: so.tax_amount,
          total_amount: so.grand_total, source_ref: so.so_no, voucher_id: v.id,
          status: '正常', created_at: ds2
        });

        /* 收款：82% 回款 */
        if (rnd() < 0.82) {
          const rd = clampYear(new Date(new Date(dls).getTime() + RI(10, 60) * 86400000));
          if (rd.getFullYear() === 2026) {
            const rs = `${rd.getFullYear()}-${pad(rd.getMonth() + 1, 2)}-${pad(rd.getDate(), 2)}T16:00:00.000Z`;
            bankN++;
            const ym = `${rd.getFullYear()}${pad(rd.getMonth() + 1, 2)}`;
            D.bank_transactions.push({
              id: nextIdFor('bank_transactions'), bank_tx_id: `BTX-${ym}-${pad(bankN, 4)}`, account_no: MAIN_ACCT,
              tx_date: rs, tx_time: `${pad(RI(9, 17), 2)}:${pad(RI(0, 59), 2)}`,
              tx_type: '收入', amount: so.grand_total,
              counterparty: cus.customer_name, counterparty_account: '66' + pad(RI(100000000, 999999999), 9),
              channel: '网银', summary: `银行收款-${cus.customer_name}货款`,
              voucher_id: v.id, matched: 1, created_at: rs
            });
          }
        }
      }
    });

    /* ============================================================
     * ③ OA 报销链：报销单 → 审批记录 → 凭证
     * ============================================================ */
    let oaN = 0, apN = 0;
    const oaEmps = D.employees.filter((e) => ['D011', 'D012', 'D014', 'D015', 'D019', 'D020', 'D028', 'D004', 'D006'].indexOf(e.dept_code) >= 0);
    MONTHS.forEach((m) => {
      const cnt = RI(28, 34);
      for (let k = 0; k < cnt; k++) {
        oaN++;
        const dept = ['差旅', '办公', '招待', '交通'];
        const type = pick(dept);
        const isSuspicious = rnd() < 0.08;
        const emp = isSuspicious ? D.employees.find((e) => e.emp_code === 'EMP031') : pick(oaEmps);
        const maxDay = daysInMonth(YEAR, m);
        const day = isSuspicious || rnd() < 0.3 ? RI(Math.max(1, maxDay - 2), maxDay) : RI(1, maxDay - 3);
        const ds = dstr(YEAR, m, day) + 'T16:00:00.000Z';
        let amount = round2(R(2000, 60000));
        if (type === '招待') amount = round2(R(8000, 88000));
        if (isSuspicious) amount = round2(R(60000, 98000));
        const rep = {
          id: nextIdFor('oa_expense_reports'), report_no: `EXP-${YEAR}${pad(m, 2)}-${pad(oaN, 4)}`, emp_code: emp.emp_code,
          dept_code: emp.dept_code, expense_type: type, amount,
          submit_date: ds, status: '已审批', voucher_id: 0,
          description: `${type}费报销-天津-${pick(['上海', '北京', '广州', '深圳', '成都', '南京'])}-${emp.position}出差`,
          created_at: ds
        };
        D.oa_expense_reports.push(rep);

        /* 凭证：可疑报销的凭证金额与报销金额不符 */
        vchN++;
        const vAmt = isSuspicious ? round2(amount * R(0.45, 0.7)) : amount;
        const v = {
          id: nextIdFor('gl_vouchers'), voucher_no: `VCH-${YEAR}${pad(m, 2)}-${pad(vchN, 4)}`, voucher_date: ds,
          voucher_type: '记', summary: `${type}费报销-${emp.emp_name}`, source_system: 'OA',
          source_ref: rep.report_no, total_debit: vAmt, total_credit: vAmt,
          maker: 'EMP007', reviewer: 'EMP006', status: '已审核', created_at: ds
        };
        D.gl_vouchers.push(v);
        rep.voucher_id = v.id;
        makeEntries(v, [
          { subject_code: type === '办公' ? '6602-01' : type === '招待' ? '6601-02' : type === '差旅' ? '6601-01' : '6602-02',
            summary: `${type}费`, debit: vAmt, cost_center: 'CC-MGT-01' },
          { subject_code: '1002-01', summary: '银行付款', credit: vAmt }
        ]);

        /* 审批记录：常规 2 级；可疑仅 1 级（补签） */
        apN++;
        D.oa_approval_records.push({
          id: nextIdFor('oa_approval_records'), report_id: rep.id, approver_code: 'EMP038', approver_name: '贾立新',
          step: 1, action: '同意', comment: '同意', action_time: ds, created_at: ds
        });
        if (!isSuspicious) {
          apN++;
          D.oa_approval_records.push({
            id: nextIdFor('oa_approval_records'), report_id: rep.id, approver_code: 'EMP005', approver_name: '梁秀兰',
            step: 2, action: '同意', comment: '审核通过', action_time: ds, created_at: ds
          });
        }

        /* 报销付款流水 */
        const rd = clampYear(new Date(new Date(ds).getTime() + RI(3, 8) * 86400000));
        if (rd.getFullYear() === 2026) {
          const rs = `${rd.getFullYear()}-${pad(rd.getMonth() + 1, 2)}-${pad(rd.getDate(), 2)}T16:00:00.000Z`;
          bankN++;
          const ym = `${rd.getFullYear()}${pad(rd.getMonth() + 1, 2)}`;
          D.bank_transactions.push({
            id: nextIdFor('bank_transactions'), bank_tx_id: `BTX-${ym}-${pad(bankN, 4)}`, account_no: MAIN_ACCT,
            tx_date: rs, tx_time: `${pad(RI(9, 17), 2)}:${pad(RI(0, 59), 2)}`,
            tx_type: '支出', amount, counterparty: emp.emp_name,
            counterparty_account: emp.bank_account, channel: '网银',
            summary: `报销付款-${emp.emp_name}-${type}费`, voucher_id: v.id, matched: 1, created_at: rs
          });
        }
      }
    });

    /* ============================================================
     * ④ 研发工时 / 税务申报 / 总账明细
     * ============================================================ */
    const rdEmps = ['EMP027', 'EMP028', 'EMP026', 'EMP031'];
    rdEmps.forEach((ec) => {
      MONTHS.forEach((m) => {
        const prj = pick(PRJ_SEED)[0];
        const hours = rnd() < 0.25 ? round2(R(26, 38)) : round2(R(6, 16));
        const rate = round2(R(300, 480));
        const d = RI(1, daysInMonth(YEAR, m));
        D.rd_timesheets.push({
          id: nextIdFor('rd_timesheets'), emp_code: ec, project_code: prj, cost_center: pick(['CC-RD-01', 'CC-RD-02']),
          work_date: dstr(YEAR, m, d) + 'T16:00:00.000Z', hours, hourly_rate: rate,
          labor_cost: round2(hours * rate), description: pick(['算法研发与测试', '代码审查与优化', '系统集成联调', '样机试制']),
          created_at: dstr(YEAR, m, d) + 'T16:00:00.000Z'
        });
      });
    });

    MONTHS.forEach((m) => {
      const ym = `${YEAR}${pad(m, 2)}`;
      const sos = D.sal_orders.filter((s) => s.order_date.slice(0, 7) === `${YEAR}-${pad(m, 2)}`);
      const outputAmount = round2(sos.reduce((a, s) => a + s.total_amount, 0));
      const outputTax = round2(sos.reduce((a, s) => a + s.tax_amount, 0));
      const pos = D.pur_orders.filter((p) => p.order_date.slice(0, 7) === `${YEAR}-${pad(m, 2)}`);
      const inputAmount = round2(pos.reduce((a, p) => a + p.total_amount, 0));
      const inputTax = round2(pos.reduce((a, p) => a + p.tax_amount, 0));
      D.tax_vat_declarations.push({
        id: nextIdFor('tax_vat_declarations'), declaration_period: ym, output_amount: outputAmount, output_tax: outputTax,
        input_amount: inputAmount, input_tax: inputTax,
        payable_tax: round2(outputTax - inputTax), actual_paid: round2(outputTax - inputTax),

    let ledgerId = 1;

    return D;

        rows.push({
          chain: '费用报销链', 主体: emp.emp_name || o.emp_code, 主体编码: o.emp_code,
          单据号: o.report_no, 业务日期: ymd(o.submit_date), 金额: r2(o.amount),
          物料: o.expense_type, 入库单号: '—', 入库日期: '—',
          发票号: '—', 发票金额: 0,
          付款笔数: 1, 付款金额: r2(o.amount),
          制单人: emp.position || '—',
          链条完整: aprv.length >= 2 && v ? '完整' : '缺失',
          _reportId: o.id
        });
        entities.add(o.emp_code);
        dates.push(ymd(o.submit_date));
        stats.笔数 += 1;
        stats.金额合计 = r2(stats.金额合计 + num(o.amount));
      });
    }

    /* —— 资金流链 —— */
    if (chains.indexOf('fund') >= 0) {
      tables.push('bank_accounts', 'bank_transactions', 'gl_vouchers');
      filterBank(ctx).forEach((t) => {
        const v = t.voucher_id ? ctx.vchById.get(t.voucher_id) : null;
        rows.push({
          chain: '资金流链', 主体: t.counterparty, 主体编码: t.counterparty_account,
          单据号: t.bank_tx_id, 业务日期: ymd(t.tx_date), 金额: r2(t.amount),
          物料: t.tx_type, 入库单号: '—', 入库日期: '—',
          发票号: v ? v.voucher_no : '（未挂接）', 发票金额: v ? r2(v.total_debit) : 0,
          付款笔数: 1, 付款金额: r2(t.amount),
          制单人: '—', 链条完整: v ? '完整' : '缺失',
          _txId: t.id
        });
        entities.add(t.counterparty);
        dates.push(ymd(t.tx_date));
        stats.笔数 += 1;
        stats.金额合计 = r2(stats.金额合计 + num(t.amount));
      });
    }

    /* 结果行合并（采购链已含银行付款，资金流链可能重复，这里按单据号去重） */
    const seen = new Set();
    const dedup = rows.filter((r) => {
      const k = r.chain + '|' + r.单据号;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });

    /* —— 数据完整度校验 —— */
    const integrity = [];
    /* 借贷平衡校验 */
    const unbal = D.gl_vouchers.filter((v) => Math.abs(num(v.total_debit) - num(v.total_credit)) > 0.01);
    integrity.push({
      校验项: '凭证借贷平衡', 结果: unbal.length ? '存在不平' : '通过',
      说明: unbal.length ? `${unbal.length} 张凭证借贷不平` : '全部凭证借贷平衡',
      涉及表: 'gl_vouchers'
    });
    /* 分录平衡 */
    let entryUnbal = 0;
    Object.keys(ctx.entriesByVoucher).forEach((vid) => {
      const es = ctx.entriesByVoucher[vid];
      const d = sumBy(es, (e) => e.debit_amount), c = sumBy(es, (e) => e.credit_amount);
      if (Math.abs(d - c) > 0.01) entryUnbal++;
    });
    integrity.push({
      校验项: '分录借贷平衡', 结果: entryUnbal ? '存在不平' : '通过',
      说明: entryUnbal ? `${entryUnbal} 张凭证分录不平` : '全部分录借贷平衡',
      涉及表: 'gl_voucher_entries'
    });
    /* 孤立记录：单据引用不到主数据 */
    const orphan = {
      '采购订单未匹配到供应商': D.pur_orders.filter((po) => !ctx.supByCode[po.supplier_code]).length,
      '销售订单未匹配到客户': D.sal_orders.filter((so) => !ctx.cusByCode[so.customer_code]).length,
      '入库单未匹配到采购订单': D.pur_receipts.filter((r) => !ctx.poById.has(r.po_id)).length,
      '银行流水未挂接凭证': D.bank_transactions.filter((t) => !t.voucher_id || !ctx.vchById.has(t.voucher_id)).length,
      '报销单未挂接凭证': D.oa_expense_reports.filter((o) => !o.voucher_id || !ctx.vchById.has(o.voucher_id)).length
    };
    Object.keys(orphan).forEach((k) => {
      integrity.push({ 校验项: k, 结果: orphan[k] ? '存在孤立记录' : '通过', 说明: `${orphan[k]} 条`, 涉及表: '关联校验' });
    });

    const sorted = dates.filter(Boolean).sort();
    stats.时间跨度 = { from: sorted[0] || '—', to: sorted[sorted.length - 1] || '—' };
    stats.涉及主体数 = entities.size;
    stats.纳入分析的表 = tables.length;

    return {
      module: 'data_aggregate',
      title: '多源数据聚合结果',
      params: p,
      chains: chains.map((k) => CHAINS[k] && CHAINS[k].name).filter(Boolean),
      columns: ['chain', '主体', '单据号', '业务日期', '金额', '物料', '入库单号', '发票号', '发票金额', '付款笔数', '付款金额', '链条完整'],
      rows: dedup.slice(0, 500),
